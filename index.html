<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG Idle de Masmorras</title>
  <style>
    :root { --bg:#0e1220; --card:#171d33; --borda:#2a3354; --texto:#e8ecf5; --suave:#8f9ab8; --acento:#7cf0c9; --perigo:#ff7a7a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--texto); font:15px/1.4 system-ui, sans-serif; }
    header { padding:14px 20px; border-bottom:1px solid var(--borda); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; align-items:baseline; }
    h1 { margin:0; font-size:20px; } h1 small { color:var(--suave); font-weight:400; font-size:13px; margin-left:8px; }
    h2 { margin:0 0 10px; font-size:16px; color:var(--acento); }
    main { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; padding:16px 20px; }
    section { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:14px; }
    .barra { position:relative; height:22px; background:#0b0f1d; border-radius:6px; overflow:hidden; margin-bottom:6px; }
    .barra div { height:100%; background:#d9534f; } .barra.xp div { background:#4f8bd9; }
    .barra span { position:absolute; inset:0; text-align:center; font-size:12px; line-height:22px; }
    .atributos { list-style:none; display:flex; gap:14px; padding:0; margin:8px 0; flex-wrap:wrap; }
    .stats { color:var(--suave); font-size:13px; margin:6px 0 10px; }
    .slots { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px; }
    .rotulo { font-size:12px; color:var(--suave); margin-bottom:2px; }
    .item { border:1px solid var(--borda); border-radius:8px; padding:8px; margin-bottom:8px; background:#12172b; }
    .item small { color:var(--suave); } .hab { font-size:13px; } .linhas { font-size:13px; color:var(--suave); }
    .vazio { color:var(--suave); font-size:13px; padding:8px; border:1px dashed var(--borda); border-radius:8px; }
    .botoes { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .botoes.grande { margin:10px 0 14px; }
    button { background:#222b4a; color:var(--texto); border:1px solid var(--borda); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }
    button:hover:not(:disabled) { border-color:var(--acento); } button:disabled { opacity:.4; cursor:default; }
    button.ligado { background:var(--acento); color:#0e1220; } button.perigo { color:var(--perigo); }
    select { width:100%; padding:8px; background:#0b0f1d; color:var(--texto); border:1px solid var(--borda); border-radius:8px; font:inherit; }
    .log { list-style:none; padding:0; margin:0; font-size:13px; } .log li { padding:4px 0; border-bottom:1px solid #222a47; }
    .aviso { color:#ffb84d; margin:4px 0; } .erro { padding:20px; color:var(--perigo); } .rodape { margin-top:14px; }
  </style>
</head>
<body>
  <div id="app"><p style="padding:20px">Carregando…</p></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
